<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>EGO Transition Probe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef5f8;
        }

        .probe-page {
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 24px;
        }

        .probe-card {
            width: min(100%, 480px);
            padding: 32px;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(7, 36, 57, .15);
            text-align: center;
        }

        .probe-button {
            min-height: 52px;
            padding: 0 24px;
            border: 0;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, #16b7d4, #0e9f8e);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        #probeLoader {
            position: fixed;
            z-index: 2147483647;
            inset: 0;
            display: none;
            place-items: center;
            color: #fff;
            background:
                radial-gradient(
                    circle at center,
                    rgba(22, 183, 212, .24),
                    transparent 380px
                ),
                linear-gradient(145deg, #020d18, #06344a);
        }

        #probeLoader.show {
            display: grid;
        }

        .probe-loader-content {
            text-align: center;
        }

        .probe-spinner {
            position: relative;
            display: grid;
            width: 170px;
            height: 170px;
            place-items: center;
            margin: auto auto 24px;
        }

        .probe-ring {
            position: absolute;
            inset: 0;
            border: 4px solid rgba(255,255,255,.1);
            border-top-color: #22d8e8;
            border-right-color: #22d8e8;
            border-radius: 50%;
            animation: rotate 1.1s linear infinite;
        }

        .probe-ring.second {
            inset: 17px;
            border-width: 2px;
            border-top-color: #23d3b1;
            border-right-color: transparent;
            animation-direction: reverse;
            animation-duration: 1.7s;
        }

        .probe-logo-box {
            display: grid;
            width: 90px;
            height: 90px;
            place-items: center;
            border-radius: 28px;
            background: #fff;
            box-shadow: 0 0 45px rgba(22, 183, 212, .35);
        }

        .probe-logo-box img {
            width: 74px;
            height: 58px;
            object-fit: contain;
        }

        .probe-progress {
            position: relative;
            width: 300px;
            height: 5px;
            margin: 22px auto 0;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255,255,255,.12);
        }

        .probe-progress::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: -45%;
            width: 45%;
            background: linear-gradient(
                90deg,
                transparent,
                #22d8e8,
                #23d3b1,
                transparent
            );
            animation: progress 1s ease-in-out infinite;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes progress {
            to {
                left: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="probe-page">
        <section class="probe-card">
            <h1>Kiểm tra hiệu ứng chuyển trang</h1>

            <p>
                Nút dưới đây không dùng Laravel, sidebar hoặc JavaScript CRM.
            </p>

            <button
                type="button"
                class="probe-button"
                id="probeButton"
            >
                Bật hiệu ứng trong 3 giây
            </button>
        </section>
    </main>

    <div id="probeLoader">
        <div class="probe-loader-content">
            <div class="probe-spinner">
                <span class="probe-ring"></span>
                <span class="probe-ring second"></span>

                <span class="probe-logo-box">
                    <img
                        src="/images/ego-logo.png"
                        alt="EGO Solar"
                    >
                </span>
            </div>

            <h2>Đang chuyển không gian làm việc</h2>
            <p>Đang đồng bộ dữ liệu...</p>

            <div class="probe-progress"></div>
        </div>
    </div>

    <script>
        document
            .getElementById('probeButton')
            .addEventListener('click', function () {
                var loader =
                    document.getElementById('probeLoader');

                loader.classList.add('show');

                window.setTimeout(function () {
                    loader.classList.remove('show');
                }, 3000);
            });
    </script>
</body>
</html>
